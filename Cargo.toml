[package]
name = "subtracker"
version = "0.1.0"
edition = "2024"
authors = ["Morfusee <markvalenzuela.coding@gmail.com>"]
description = "A responsive terminal UI dashboard for tracking AI subscription quotas (Codex, OpenCode, Antigravity)"
readme = "README.md"
repository = "https://github.com/Morfusee/subtracker-cli"
homepage = "https://github.com/Morfusee/subtracker-cli"
license = "MIT"
keywords = ["tui", "dashboard", "ai", "quota", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "stc"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strip-ansi-escapes = "0.2"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

