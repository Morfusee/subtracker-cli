name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            kind: windows
          - os: macos-15
            target: aarch64-apple-darwin
            kind: macos
          - os: macos-15
            target: x86_64-apple-darwin
            kind: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $name = "stc-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/stc.exe" `
            -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "$name.sha256"
          Copy-Item "target/${{ matrix.target }}/release/stc.exe" -Destination "stc.exe"
          $exeHash = (Get-FileHash "stc.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  stc.exe" | Set-Content "stc.exe.sha256"

      - name: Package macOS
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          name="stc-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$name" stc
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            stc-${{ matrix.target }}.zip
            stc-${{ matrix.target }}.zip.sha256
            stc.exe
            stc.exe.sha256
            stc-${{ matrix.target }}.tar.gz
            stc-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: ignore

  upload-assets:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" stc-* --clobber
